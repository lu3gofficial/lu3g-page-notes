# Pubblica una release quando si invia un tag di versione (es. v1.2.0):
# controlla che il tag corrisponda alla "Version" del plugin, crea lo zip e lo allega alla release.
# In alternativa si avvia a mano da Actions → Release → Run workflow: il tag lo crea la release, dalla "Version" del plugin.
# I siti con il plugin installato vedono l'aggiornamento in Bacheca → Aggiornamenti (entro 6 ore, o subito con "Controlla di nuovo").
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Controllo versione
        run: |
          v=$(grep -m1 -E '^\s*\*\s*Version:' lu3g-page-notes.php | awk '{print $NF}')
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "TAG=v$v" >> "$GITHUB_ENV"
          else
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} diverso dalla Version del plugin ($v)"; exit 1; }
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
      - name: Pacchetto
        run: sh bin/build.sh
      - name: Note dal CHANGELOG
        run: |
          v=${TAG#v}
          awk -v v="$v" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Versione $v" > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" dist/lu3g-page-notes.zip --target "${GITHUB_SHA}" --title "${TAG}" --notes-file notes.md
